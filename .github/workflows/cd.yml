name: Terraform CD

on:
  pull_request_target:
    types: [closed]
    branches:
      - staging
    paths:
      - 'environments/stg/**'
      - 'environments/prd/**'
      - '!modules/**'

permissions:
  contents: read
  pull-requests: write   # allow comment on PR

jobs:
  terraform-cd:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed directories
        id: changed-dirs
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          echo "Changed files:"
          echo "$CHANGED_FILES"
          CHANGED_DIRS=$(echo "$CHANGED_FILES" \
            | grep '^environments/' \
            | xargs -n1 dirname | sort -u || true)
          echo "Changed dirs (multiline):"
          echo "$CHANGED_DIRS"
          CHANGED_DIRS_SINGLE_LINE=$(echo $CHANGED_DIRS)
          echo "Changed dirs (single line):"
          echo "$CHANGED_DIRS_SINGLE_LINE"
          echo "dirs=$CHANGED_DIRS_SINGLE_LINE" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        id: tf
        run: |
          RESULT=""
          for dir in ${{ steps.changed-dirs.outputs.dirs }}; do
            echo "---- Running in $dir ----"
            cd "$dir"
            terraform init -input=false -backend-config="use_lockfile=true"
            terraform apply -auto-approve -input=false -no-color
            OUT=$(terraform output -json || echo "No outputs")
            RESULT="$RESULT\n\n### $dir\n\`\`\`\n$OUT\n\`\`\`"
            cd - >/dev/null
          done

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Apply Result on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-apply
          message: |
            ## Terraform Apply Result
            ${{ steps.tf.outputs.result }}
