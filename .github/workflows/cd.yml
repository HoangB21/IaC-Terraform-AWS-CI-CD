name: Terraform CD

on:
  workflow_dispatch:

  pull_request_target:
    types: [closed]
    branches:
      - staging
    paths:
      - 'environments/stg/**'

permissions:
  contents: read
  pull-requests: write   # allow comment on PR

jobs:
  terraform-cd:
    runs-on: self-hosted

    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changed Terraform directories
        id: changed
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            stg:
              - 'environments/stg/**'
            prd:
              - 'environments/prd/**'

      - name: Collect changed directories
        id: collect
        run: |
          CHANGED_DIRS=""
          for file in ${{ steps.changed.outputs.stg_files }} ${{ steps.changed.outputs.prd_files }}; do
            DIR=$(dirname "$file")
            ROOT_DIR=$(echo "$DIR" | cut -d'/' -f1-3)

            if ls "$ROOT_DIR"/*.tf > /dev/null 2>&1; then
              CHANGED_DIRS="$CHANGED_DIRS $ROOT_DIR"
            fi
          done

          # Loại bỏ trùng và dòng trống
          CHANGED_DIRS=$(echo "$CHANGED_DIRS" | tr ' ' '\n' | sort -u | grep -v '^$')
          echo "Detected Terraform directories:"
          echo "$CHANGED_DIRS"

          echo "dirs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_DIRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        id: tf
        run: |
          RESULT=""
          echo "${{ steps.collect.outputs.dirs }}" | grep -v '^$' > dirs.txt
          mapfile -t DIRS < dirs.txt

          for dir in "${DIRS[@]}"; do
            echo "---- Running in $dir ----"
            cd "$dir"

            terraform init -input=false -backend-config="use_lockfile=true"
            terraform apply -auto-approve -input=false -no-color || true

            OUT=$(terraform output -json || echo "No outputs")
            RESULT="$RESULT\n\n### $dir\n\`\`\`\n$OUT\n\`\`\`"
            cd - >/dev/null
          done

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Apply Result on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-apply
          message: |
            ## Terraform Apply Result
            ${{ steps.tf.outputs.result }}
