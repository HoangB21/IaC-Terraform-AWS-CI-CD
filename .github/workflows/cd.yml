name: Terraform CD

on:
  push:
    branches:
      - staging
    paths:
      - 'environments/stg/**'
      - 'environments/prd/**'
      - '!modules/**'

permissions:
  contents: read
  pull-requests: write   # để comment vào PR
  issues: write          # dự phòng nếu dùng issues API

jobs:
  terraform-cd:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find changed directories
        id: changed-dirs
        run: |
          CHANGED_DIRS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | \
            grep '^environments/' | cut -d/ -f1-4 | sort -u)
          echo "dirs=$CHANGED_DIRS" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        id: tf
        run: |
          RESULT=""
          for dir in ${{ steps.changed-dirs.outputs.dirs }}; do
            echo "---- Running in $dir ----"
            cd $dir
            terraform init -input=false
            terraform apply -auto-approve -input=false -no-color
            OUT=$(terraform output -json || echo "No outputs")
            RESULT="$RESULT\n\n### $dir\n\`\`\`\n$OUT\n\`\`\`"
            cd - >/dev/null
          done
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment apply result on PR
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;

            // Tìm PR đã merge chứa commit vừa push
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commitSha,
            });

            if (prs.data.length === 0) {
              core.warning("No PR found for this commit, skipping comment.");
            } else {
              const prNumber = prs.data[0].number;
              const output = `## Terraform Apply Result\n${{ steps.tf.outputs.result }}`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: output,
              });
            }
