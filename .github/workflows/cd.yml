name: Terraform CD

on:
  push:
    branches:
      - staging
    paths:
      - 'environments/stg/**'
      - 'environments/prd/**'
      - '!modules/**'

permissions:
  contents: read
  pull-requests: write   # để comment vào PR
  issues: write          # phòng khi cần dùng issues API

jobs:
  terraform-cd:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần full history để diff

      - name: Find changed directories
        id: changed-dirs
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "Changed files:"
          echo "$CHANGED_FILES"

          CHANGED_DIRS=$(echo "$CHANGED_FILES" \
            | grep '^environments/' \
            | xargs -n1 dirname | sort -u || true)

          echo "Changed dirs (multiline):"
          echo "$CHANGED_DIRS"

          CHANGED_DIRS_SINGLE_LINE=$(echo $CHANGED_DIRS)

          echo "Changed dirs (single line):"
          echo "$CHANGED_DIRS_SINGLE_LINE"

          echo "dirs=$CHANGED_DIRS_SINGLE_LINE" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        id: tf
        run: |
          RESULT=""
          for dir in ${{ steps.changed-dirs.outputs.dirs }}; do
            echo "---- Running in $dir ----"
            cd "$dir"
            terraform init -input=false -backend-config="use_lockfile=true"
            terraform apply -auto-approve -input=false -no-color
            OUT=$(terraform output -json || echo "No outputs")
            RESULT="$RESULT\n\n### $dir\n\`\`\`\n$OUT\n\`\`\`"
            cd - >/dev/null
          done

          # xuất output để dùng ở step sau
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # lưu kết quả vào file cho summary + artifact
          echo -e "$RESULT" > ${{ runner.temp }}/terraform-apply-result.md

      - name: Add summary
        run: |
          echo "## Terraform Apply Result" >> $GITHUB_STEP_SUMMARY
          cat ${{ runner.temp }}/terraform-apply-result.md >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-result
          path: ${{ runner.temp }}/terraform-apply-result.md

      - name: Comment apply result on PR
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;

            // Tìm PR đã merge chứa commit vừa push
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commitSha,
            });

            if (prs.data.length === 0) {
              core.warning("No PR found for this commit, skipping comment.");
            } else {
              const prNumber = prs.data[0].number;
              const output = `## Terraform Apply Result\n${{ steps.tf.outputs.result }}`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: output,
              });
            }
