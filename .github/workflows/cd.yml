name: Terraform CD

on:
  workflow_dispatch:

  pull_request_target:
    types: [closed]
    branches:
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-cd:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Terraform directories
        id: changed
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            stg:
              - 'environments/stg/**'

      - name: Collect changed directories
        id: collect
        run: |
          CHANGED_DIRS=""
          for file in ${{ steps.changed.outputs.stg_files }}; do
            DIR=$(dirname "$file")
            CHANGED_DIRS="$CHANGED_DIRS $DIR"
          done

          CHANGED_DIRS=$(echo "$CHANGED_DIRS" | tr ' ' '\n' | sort -u | grep -v '^$')
          echo "Detected Terraform directories:"
          echo "$CHANGED_DIRS"

          echo "dirs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_DIRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Sort changed dirs by dependency order
        id: sort
        run: |
          echo "Sorting changed directories by environments/.modules_order.txt..."
          mapfile -t ORDER < environments/.modules_order.txt
          echo "${{ steps.collect.outputs.dirs }}" | tr ' ' '\n' | sort -u > changed_dirs.txt

          SORTED=""
          for module in "${ORDER[@]}"; do
            match=$(grep "environments/stg/${module}" changed_dirs.txt || true)
            if [[ -n "$match" ]]; then
              SORTED="$SORTED $match"
            fi
          done

          echo "Sorted directories:"
          echo "$SORTED"

          echo "sorted<<EOF" >> $GITHUB_OUTPUT
          echo "$SORTED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        id: tf
        run: |
          RESULT=""
          echo "${{ steps.sort.outputs.sorted }}" | grep -v '^$' > dirs.txt
          mapfile -t DIRS < dirs.txt

          for dir in "${DIRS[@]}"; do
            echo "---- Running in $dir ----"
            cd "$dir"

            terraform init -input=false -backend-config="use_lockfile=true"
            terraform apply -auto-approve -input=false -no-color

            OUT=$(terraform output -json || echo "No outputs")
            RESULT="$RESULT\n\n### $dir\n\`\`\`\n$OUT\n\`\`\`"
            cd - >/dev/null
          done

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Apply Result on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-apply
          message: |
            ## Terraform Apply Result
            ${{ steps.tf.outputs.result }}
