# Test CI/CD with approval
name: Terraform CI/CD

on:
  workflow_dispatch:

  pull_request:
    branches:
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v3

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'environments/stg/**'

      - name: Comment when no Terraform changes
        if: steps.filter.outputs.terraform != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          message: |
            ## Terraform Plan Result
            No changes detected in `environments/stg/`.
            Skipping Terraform plan.

  terraform-ci:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.terraform == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changed Terraform directories
        id: changed
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            stg:
              - 'environments/stg/**'

      - name: Collect changed directories
        id: collect
        run: |
          CHANGED_DIRS=""
          for file in ${{ steps.changed.outputs.stg_files }}; do
            DIR=$(dirname "$file")
            CHANGED_DIRS="$CHANGED_DIRS $DIR"
          done

          CHANGED_DIRS=$(echo "$CHANGED_DIRS" | tr ' ' '\n' | sort -u | grep -v '^$')
          echo "Detected Terraform directories:"
          echo "$CHANGED_DIRS"

          echo "dirs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_DIRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Order directories based on .modules_order
        id: ordered
        run: |
          ORDERED_DIRS=""

          if [ -f ".modules_order" ]; then
            echo "Using .modules_order to determine directory order..."
            echo "${{ steps.collect.outputs.dirs }}" | tr ' ' '\n' | sort -u > changed_dirs.txt

            while IFS= read -r line; do
              if grep -qx "environments/stg/$line" changed_dirs.txt; then
                ORDERED_DIRS="${ORDERED_DIRS}\nenvironments/stg/$line"
              fi
            done < .modules_order

            echo "Ordered changed dirs:"
            # In từng dòng cho dễ đọc
            echo -e "$ORDERED_DIRS" | sed '/^$/d'
          else
            echo "No .modules_order found, using default changed order."
            ORDERED_DIRS="$(echo "${{ steps.collect.outputs.dirs }}" | tr ' ' '\n')"
          fi

          echo "dirs<<EOF" >> $GITHUB_OUTPUT
          echo -e "$ORDERED_DIRS" | sed '/^$/d' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Terraform Validate + Plan
        id: tf
        run: |
          RESULT=""
          echo "${{ steps.ordered.outputs.dirs }}" | grep -v '^$' > dirs.txt
          mapfile -t DIRS < dirs.txt  

          for dir in "${DIRS[@]}"; do
            echo "---- Running in $dir ----"
            cd "$dir"

            terraform init -input=false
            terraform fmt -check
            terraform validate
            terraform plan -input=false -no-color -out=tfplan || true

            terraform show -no-color tfplan > plan.txt
            FULL_PLAN=$(cat plan.txt)

            RESULT="$RESULT\n\n### $dir\n\`\`\`\n$FULL_PLAN\n\`\`\`"
            cd - >/dev/null
          done

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          message: |
            ## Terraform Plan Result
            ${{ steps.tf.outputs.result }}
  
  approval:
    needs: terraform-ci
    runs-on: ubuntu-latest
    timeout-minutes: 1440 # 24 hours
    environment:
      name: staging
    steps:
      - run: echo "Waiting for manual approval..."

  terraform-cd:
    runs-on: self-hosted
    timeout-minutes: 60
    needs: [approval, changes]
    if: needs.changes.outputs.terraform == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Terraform directories
        id: changed
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            stg:
              - 'environments/stg/**'

      - name: Collect changed directories
        id: collect
        run: |
          CHANGED_DIRS=""
          for file in ${{ steps.changed.outputs.stg_files }}; do
            DIR=$(dirname "$file")
            CHANGED_DIRS="$CHANGED_DIRS $DIR"
          done

          CHANGED_DIRS=$(echo "$CHANGED_DIRS" | tr ' ' '\n' | sort -u | grep -v '^$')
          echo "Detected Terraform directories:"
          echo "$CHANGED_DIRS"

          echo "dirs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_DIRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Sort changed dirs by dependency order
        id: sort
        run: |
          echo "Sorting changed directories by environments/.modules_order..."
          mapfile -t ORDER < environments/.modules_order
          echo "${{ steps.collect.outputs.dirs }}" | tr ' ' '\n' | sort -u > changed_dirs.txt

          SORTED=""
          for module in "${ORDER[@]}"; do
            match=$(grep "environments/stg/${module}" changed_dirs.txt || true)
            if [[ -n "$match" ]]; then
              SORTED="$SORTED $match"
            fi
          done

          echo "Sorted directories:"
          echo "$SORTED"

          echo "sorted<<EOF" >> $GITHUB_OUTPUT
          echo "$SORTED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        id: tf
        run: |
          RESULT=""
          echo "${{ steps.sort.outputs.sorted }}" | grep -v '^$' > dirs.txt
          mapfile -t DIRS < dirs.txt

          for dir in "${DIRS[@]}"; do
            echo "---- Running in $dir ----"
            cd "$dir"

            terraform init -input=false -backend-config="use_lockfile=true"
            terraform apply -auto-approve -input=false -no-color

            OUT=$(terraform output -json || echo "No outputs")
            RESULT="$RESULT\n\n### $dir\n\`\`\`\n$OUT\n\`\`\`"
            cd - >/dev/null
          done

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Apply Result on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-apply
          message: |
            ## Terraform Apply Result
            ${{ steps.tf.outputs.result }}