# Test CI/CD with approval
name: Terraform CI/CD

on:
  workflow_dispatch:
  
  pull_request:

jobs:
  ci:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo "CI in progress..."

  approval:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
    steps:
      - run: echo "Waiting for manual approval..."

  cd:
    needs: approval
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo "CD in progress..."
